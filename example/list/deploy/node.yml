---
- name: Deploy Raft list node
  serial: 1
  hosts: raft_nodes
  become: true

  pre_tasks:
    - name: Validate target operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
        fail_msg: Only Debian and Ubuntu VPS targets are supported.

    - name: Validate Raft node variables
      ansible.builtin.assert:
        that:
          - raft_node_id is defined
          - raft_node_id | length > 0
          - raft_auth_token is defined
          - raft_auth_token | length > 0
          - registry_username is defined
          - registry_username | length > 0
          - registry_password is defined
          - registry_password | length > 0
          - loki_push_url is defined
          - loki_push_url | length > 0
          - loki_push_url != 'replace-me'
          - loki_push_url is match('^https://.+/loki/api/v1/push$')
          - loki_username is defined
          - loki_username | length > 0
          - loki_username != 'replace-me'
          - loki_password is defined
          - loki_password | length > 0
          - loki_password != 'replace-me'
        fail_msg: Configure inventory/hosts.yml and encrypted group_vars/all/vault.yml before deploying.

    - name: Select Docker repository architecture
      ansible.builtin.set_fact:
        docker_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, ansible_architecture) }}"

  tasks:
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Docker repository signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Raft deployment directory
      ansible.builtin.file:
        path: "{{ raft_deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Create deployment secrets directory
      ansible.builtin.file:
        path: "{{ raft_deploy_dir }}/secrets"
        state: directory
        mode: "0700"

    - name: Render Alloy configuration
      ansible.builtin.template:
        src: templates/alloy.config.j2
        dest: "{{ raft_deploy_dir }}/alloy.config"
        mode: "0600"

    - name: Write Loki password
      ansible.builtin.copy:
        content: "{{ loki_password }}"
        dest: "{{ raft_deploy_dir }}/secrets/loki_password"
        mode: "0600"
      no_log: true

    - name: Render Docker Compose project
      ansible.builtin.template:
        src: templates/compose.yaml.j2
        dest: "{{ raft_deploy_dir }}/compose.yaml"
        mode: "0600"

    - name: Log in to the container registry
      ansible.builtin.command:
        cmd: "docker login {{ raft_registry }} --username {{ registry_username }} --password-stdin"
        stdin: "{{ registry_password }}"
      changed_when: false
      no_log: true

    - name: Pull image and start Raft node
      community.docker.docker_compose_v2:
        project_src: "{{ raft_deploy_dir }}"
        pull: always
        state: present
        remove_orphans: true

    - name: Wait for client HTTP API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ raft_client_port }}/"
        method: GET
        status_code: 200
      register: raft_http_api
      retries: 12
      delay: 5
      until: raft_http_api.status == 200
