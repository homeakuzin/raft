name: Raft

on:
    push:
        branches: ["master"]
    workflow_dispatch:

env:
    REGISTRY: registry.akuzin.tech
    SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
    SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    DEPLOY_HOSTS: ${{ secrets.DEPLOY_HOSTS }}

jobs:
    test:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Test
              run: |
                  IMAGE=raft-test:test
                  docker build . --target=test -t $IMAGE
                  docker run --rm $IMAGE

    push:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@main

            - name: Log in to registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.REGISTRY_USER }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}

            - name: Build and push
              run: |
                  image="${REGISTRY}/raft:latest"
                  docker build -t "$image" .
                  docker push "$image"

    deploy:
        needs: push
        runs-on: ubuntu-latest
        steps:
            - name: Configure SSH
              run: |
                  install -d -m 700 ~/.ssh
                  printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

            - name: Deploy canary
              run: |
                  set -eu

                  # Hosts are updated one at a time: a failure leaves all subsequent hosts unchanged.
                  for host in ${DEPLOY_HOSTS}; do
                      ssh "github@${host}" "
                      set -eu
                      cd /opt/raft
                      docker compose pull raft
                      docker compose kill raft
                      docker compose up -d --no-deps --force-recreate raft
                      "
                  done
                
    stop:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Configure SSH
              run: |
                install -d -m 700 ~/.ssh
                printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
                chmod 600 ~/.ssh/id_ed25519
                printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
            
            - name: Stop
              run: |
                set -eu
        
                for host in ${DEPLOY_HOSTS}; do
                    ssh "github@${host}" "
                    set -eu
                    cd /opt/raft
                    docker compose stop raft
                    "
                done
